CONFIG_TARGET_SITL=y

# disabilita il timer driver hw di native sim
CONFIG_NATIVE_SIM_TIMER=n
# indica che forniremo noi il timer driver per la simulazione in lockstep
CONFIG_SYS_CLOCK_EXISTS=y

# ========== Native Simulator Configuration ==========
# Minimal configuration for testing on native_sim
# Hardware-specific features are excluded

# POSIX API for better x86 compatibility
CONFIG_POSIX_API=y

# 2. Abilita il driver del simulatore di flash
CONFIG_FLASH_SIMULATOR=y
